[project]
name = "befit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.34.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "pyyaml>=6.0.2",
    "pyjwt[crypto]>=2.13.0",
    "bcrypt>=5.0.0",
    "pydantic[email]>=2.13.4",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ has no __init__.py, so `app` is not importable without this.
pythonpath = ["."]
# Every test is async; this saves marking each one with @pytest.mark.asyncio.
asyncio_mode = "auto"
# One event loop for the whole run. asyncpg connections are bound to the loop
# that opened them, so a per-test loop would break the shared engine pool with
# "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade — enforces X | None, list[X], etc.
    "B",      # bugbear
    "ASYNC",  # blocking calls inside async def
    "C4",     # comprehensions
    "SIM",    # simplify
    "RUF",
]
ignore = [
    "B008",  # Depends()/Query() in defaults is the FastAPI idiom
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
docstring-code-format = true
